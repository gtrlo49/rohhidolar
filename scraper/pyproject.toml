[project]
name = "rohhidolar-scraper"
version = "0.1.0"
description = "Hourly scraper of BCB and Bolivian bank USD prices, publishing rate.json for the RohhiDolar widget"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jose Carlos Rueda Garcia" }]
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "jsonschema>=4", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rohhidolar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true
