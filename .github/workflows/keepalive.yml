name: Keep alive

# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity, which would silently stop the scheduled scrape. This workflow runs
# monthly and, if the last commit is older than 45 days, adds an empty commit.

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Commit if the repository has been quiet for 45 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit is ${age_days} days old"
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi
