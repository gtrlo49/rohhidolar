name: Watchdog (stale data)

on:
  schedule:
    - cron: "40 1,7,13,19 * * *" # 4 runs/day, 1.5 h after each scrape (tolerates a delayed cron)
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_URL: ${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e scraper
      - name: Fail if rate.json is older than 4 hours (GitHub e-mails you on failure)
        run: python -m rohhidolar.watchdog --url "$PAGES_URL" --max-hours 4
