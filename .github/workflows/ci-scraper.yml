name: Scraper CI

on:
  pull_request:
    paths: ["scraper/**", ".github/workflows/ci-scraper.yml"]
  push:
    branches: [main]
    paths: ["scraper/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy bolidolar
      - run: pytest -q
