name: Scrape and publish

on:
  schedule:
    - cron: "10 0,6,12,18 * * *" # 4 runs/day (UTC; 20:10, 02:10, 08:10, 14:10 in La Paz); GitHub may delay it
  workflow_dispatch:
    inputs:
      accept_jump:
        description: "Accept a >15% price jump (after checking it is real)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: ${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  ROHHIDOLAR_CONTACT: ${{ vars.ROHHIDOLAR_CONTACT || format('+https://github.com/{0}', github.repository) }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Install
        run: pip install -e scraper

      - name: Scrape (fails, and publishes nothing, if validation fails)
        working-directory: scraper
        run: >
          python -m rohhidolar --out ../site --previous-url "$PAGES_URL"
          ${{ inputs.accept_jump && '--accept-jump' || '' }}

      - name: Show result
        run: head -c 1500 site/v1/rate.json

      - name: Add static pages (landing, privacy policy) and the JSON schemas
        run: |
          cp -R pages/. site/
          mkdir -p site/schema
          cp schema/*.json site/schema/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
